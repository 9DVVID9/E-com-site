<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Admin Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">🛒 TechStore Admin</div>
            <div class="user-info">
                <span>Welcome, <strong id="adminName">Admin</strong></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="dashboard-header">
            <h1>Product Management</h1>
            <p>Manage your store's product inventory</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Products</h3>
                <div class="stat-value" id="totalProducts">0</div>
            </div>
            <div class="stat-card">
                <h3>Low Stock Items</h3>
                <div class="stat-value" id="lowStock">0</div>
            </div>
            <div class="stat-card">
                <h3>Out of Stock</h3>
                <div class="stat-value" id="outOfStock">0</div>
            </div>
        </div>

        <div class="action-bar">
            <div class="search-box">
                <input type="text" id="searchProducts" placeholder="Search products...">
            </div>
            <button class="btn btn-primary" onclick="openCreateModal()">+ Add New Product</button>
        </div>

        <div class="products-table-container">
            <table class="products-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productsTableBody">
                    <tr>
                        <td colspan="6" class="empty-state">Loading products...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Product</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="productId">
                    
                    <div class="form-group">
                        <label for="productName">Product Name *</label>
                        <input type="text" id="productName" required>
                    </div>

                    <div class="form-group">
                        <label for="productCategory">Category *</label>
                        <select id="productCategory" required>
                            <option value="">Select category</option>
                            <option value="laptops">Laptops</option>
                            <option value="phones">Phones</option>
                            <option value="tvs">TVs</option>
                            <option value="tablets">Tablets</option>
                            <option value="headphones">Headphones</option>
                            <option value="keyboards">Keyboards</option>
                            <option value="mice">Mice</option>
                            <option value="monitors">Monitors</option>
                            <option value="pcs">PCs</option>
                            <option value="gaming">Gaming Equipment</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="productPrice">Price ($) *</label>
                        <input type="number" id="productPrice" step="0.01" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="productStock">Stock Quantity *</label>
                        <input type="number" id="productStock" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="productImage">Image URL *</label>
                        <input type="text" id="productImage" required>
                        <small>Enter the full URL to the product image</small>
                    </div>

                    <div class="form-group">
                        <label for="productDescription">Description *</label>
                        <textarea id="productDescription" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveProduct()">Save Product</button>
            </div>
        </div>
    </div>

    <script src="js/index.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
