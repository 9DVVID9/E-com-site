<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Product Catalog</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/catalog.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">🛒 TechStore</div>
            <nav>
                <ul class="nav-links">
                    <li><a href="catalog.html">Products</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="cart.html" class="cart-icon">
                        🛒 Cart
                        <span class="cart-count" id="cartCount">0</span>
                    </a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="search-container">
        <input type="text" class="search-bar" id="searchBar" placeholder="Search products...">
    </div>

    <div class="main-container">
        <aside class="sidebar">
            <div class="filter-card">
                <h3>Categories</h3>
                <button class="category-btn active" data-category="all">All Products</button>
                <button class="category-btn" data-category="laptops">Laptops</button>
                <button class="category-btn" data-category="phones">Phones</button>
                <button class="category-btn" data-category="tvs">TVs</button>
                <button class="category-btn" data-category="tablets">Tablets</button>
                <button class="category-btn" data-category="headphones">Headphones</button>
                <button class="category-btn" data-category="keyboards">Keyboards</button>
                <button class="category-btn" data-category="mice">Mice</button>
                <button class="category-btn" data-category="monitors">Monitors</button>
                <button class="category-btn" data-category="pcs">PCs</button>
                <button class="category-btn" data-category="gaming equipment">Gaming Equipment</button>
            </div>
        </aside>

        <section class="products-section">
            <div class="products-header">
                <h2>Our Products</h2>
                <p class="products-count">Showing <span id="productCount">0</span> products</p>
            </div>
            <div class="products-grid" id="productsGrid">
            </div>
        </section>
    </div>

    <footer>
        <div class="footer-container">
            <p>&copy; 2026 TechStore. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/index.js"></script>
    <script src="js/catalog.js"></script>
</body>
</html>
